  <style>.z{animation:f 3s ease-in-out infinite}.b{animation-delay:.5s}.c{animation-delay:1s}@keyframes f{0%,100%{opacity:.15}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.z{animation:none}}</style>
  <rect width="1000" height="96" fill="#000"/>
  <rect width="1000" height="1" fill="#262626"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" letter-spacing="3" fill="#8b8b94">
    <text x="500" y="56" text-anchor="end" dx="136">Late Night Coder</text>
    <text x="650" y="56" fill="#d8d8d8"><tspan class="z">Z</tspan><tspan class="z b">z</tspan><tspan class="z c">z</tspan></text>
  </g>
  <image x="900" y="25" width="66" height="46" href="data:image/png;base64,"/>
