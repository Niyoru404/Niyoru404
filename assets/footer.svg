<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" role="img" aria-label="Good night">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#4fd8ff"/>
  </linearGradient></defs>
  <style>.z{animation:f 3s ease-in-out infinite}.b{animation-delay:1.5s}@keyframes f{0%,100%{opacity:.2}50%{opacity:1}}</style>
  <rect width="1000" height="70" fill="#0d0524"/>
  <rect width="1000" height="2" fill="url(#g)"/>
  <text x="500" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="3" fill="#c9b6ff">good night <tspan class="z" fill="#ffe9b0">z</tspan><tspan class="z b" fill="#ffe9b0">z</tspan></text>
</svg>
