<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" role="img" aria-label="Good night">
  <style>.z{animation:f 3s ease-in-out infinite}.b{animation-delay:1.5s}@keyframes f{0%,100%{opacity:.2}50%{opacity:1}}</style>
  <rect width="1000" height="70" fill="#000"/>
  <rect width="1000" height="1" fill="#262626"/>
  <text x="500" y="44" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="3" fill="#8b8b94">good night <tspan class="z" fill="#d8d8d8">z</tspan><tspan class="z b" fill="#d8d8d8">z</tspan></text>
</svg>
