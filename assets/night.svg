<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-label="Late Night Coder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0524"/><stop offset="1" stop-color="#2b1163"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#4fd8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="crescent">
      <rect width="1000" height="220" fill="#fff"/>
      <circle cx="136" cy="84" r="46" fill="#000"/>
    </mask>
  </defs>
  <style>
    .s{fill:#e9dcff;animation:t 3s ease-in-out infinite}
    .d1{animation-delay:.6s}.d2{animation-delay:1.3s}.d3{animation-delay:2.1s}
    .eye{fill:#4fd8ff;transform-box:fill-box;transform-origin:center;animation:b 5s infinite}
    .tail{transform-origin:838px 182px;animation:w 2.6s ease-in-out infinite}
    @keyframes t{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes b{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes w{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.s,.eye,.tail{animation:none}}
  </style>
  <rect width="1000" height="220" fill="url(#sky)"/>
  <circle class="s" cx="60" cy="40" r="2"/><circle class="s d1" cx="230" cy="30" r="1.6"/>
  <circle class="s d2" cx="300" cy="170" r="2"/><circle class="s d3" cx="390" cy="28" r="1.5"/>
  <circle class="s" cx="470" cy="190" r="1.6"/><circle class="s d1" cx="560" cy="24" r="2"/>
  <circle class="s d2" cx="640" cy="192" r="1.5"/><circle class="s d3" cx="720" cy="38" r="2"/>
  <circle class="s d1" cx="800" cy="26" r="1.5"/><circle class="s d2" cx="945" cy="50" r="2"/>
  <circle class="s d3" cx="40" cy="175" r="1.6"/><circle class="s" cx="905" cy="120" r="1.5"/>
  <circle cx="110" cy="96" r="58" fill="#ffe9b0" mask="url(#crescent)" filter="url(#glow)"/>
  <text x="520" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="54" font-weight="700" fill="url(#neon)" filter="url(#glow)">Late Night Coder</text>
  <text x="520" y="152" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" letter-spacing="5" fill="#c9b6ff">NITSUKII7</text>
  <rect y="182" width="1000" height="38" fill="#0d0524"/>
  <rect y="181" width="1000" height="2" fill="#ff4fa3" opacity=".8"/>
  <g fill="#0d0524">
    <path class="tail" d="M838 182c26 0 44-12 44-38 0-10-12-10-12 0 0 16-12 26-32 26z"/>
    <path d="M792 182c-6-26 0-48 12-58l-5-27 19 14c8-2 17-2 25 0l19-14-5 27c12 10 16 32 10 58z"/>
  </g>
  <ellipse class="eye" cx="815" cy="132" rx="4.5" ry="6"/>
  <ellipse class="eye" cx="841" cy="132" rx="4.5" ry="6"/>
</svg>
